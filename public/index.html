<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceDesk</title>
<style>
  :root { --ink:#1a2233; --muted:#5b6577; --line:#d9dee8; --accent:#2456d6; --ok:#0d7a43; --bg:#f5f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:18px 28px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px; }
  h1 { font-size:22px; margin:0; }
  h1 span { color:var(--accent); }
  .tagline { color:var(--muted); font-size:13px; margin-top:2px; }
  .stats { display:flex; gap:22px; }
  .stat { text-align:right; }
  .stat .label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .stat .value { font-size:18px; font-weight:700; }
  main { max-width:880px; margin:24px auto; padding:0 16px 48px; display:grid; gap:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px; }
  .card h2 { font-size:15px; margin:0 0 14px; }
  label { font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px; }
  input { border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; width:100%; }
  input:focus { outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:6px 6px; border-bottom:1px solid var(--line); }
  td { padding:6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.num, th.num { text-align:right; }
  .row-total { font-weight:600; white-space:nowrap; }
  button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#1b44ad; color:#fff; }
  button.small { padding:4px 10px; font-size:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid3 { display:grid; grid-template-columns:2fr 1fr 1fr; gap:14px; align-items:end; }
  .summary { margin-top:16px; border-top:1px dashed var(--line); padding-top:12px; display:grid; gap:6px; max-width:340px; margin-left:auto; }
  .summary .row { display:flex; justify-content:space-between; font-size:14px; }
  .summary .grand { font-size:17px; font-weight:800; border-top:1px solid var(--line); padding-top:8px; }
  .error { display:none; background:#fdecec; border:1px solid #f3b8b8; color:#8c1d1d; border-radius:8px; padding:10px 12px; font-size:13px; margin-top:12px; }
  .error.show { display:block; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .badge.unpaid { background:#fff3d6; color:#8a6100; }
  .badge.paid { background:#e2f5ea; color:var(--ok); }
  .empty { color:var(--muted); font-size:13px; padding:10px 6px; }
  .actions { display:flex; gap:10px; margin-top:16px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Invoice<span>Desk</span></h1>
    <div class="tagline">Small invoicing for freelancers — verified end to end by Kane CLI.</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="label">Total billed</div><div class="value" id="stat-billed">$0.00</div></div>
    <div class="stat"><div class="label">Collected</div><div class="value" id="stat-collected">$0.00</div></div>
    <div class="stat"><div class="label">Outstanding</div><div class="value" id="stat-outstanding">$0.00</div></div>
  </div>
</header>

<main>
  <section class="card" aria-label="New invoice">
    <h2>New invoice</h2>
    <div class="grid3">
      <div>
        <label for="client">Client name</label>
        <input id="client" type="text" placeholder="e.g. Acme Studio" autocomplete="off">
      </div>
      <div>
        <label for="discount">Discount %</label>
        <input id="discount" type="number" min="0" max="100" step="0.5" value="0">
      </div>
      <div>
        <label for="tax">Tax %</label>
        <input id="tax" type="number" min="0" max="100" step="0.5" value="0">
      </div>
    </div>

    <table aria-label="Line items">
      <thead>
        <tr><th style="width:44%">Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line total</th><th></th></tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
    <div class="actions">
      <button id="add-item" type="button">+ Add item</button>
    </div>

    <div class="summary" aria-label="Totals">
      <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div class="row"><span>Discount</span><span id="discount-amount">−$0.00</span></div>
      <div class="row"><span>Tax</span><span id="tax-amount">$0.00</span></div>
      <div class="row grand"><span>Grand total</span><span id="grand-total">$0.00</span></div>
    </div>

    <div class="error" id="form-error" role="alert"></div>
    <div class="actions">
      <button id="save-invoice" class="primary" type="button">Save invoice</button>
      <button id="clear-form" type="button">Clear</button>
    </div>
  </section>

  <section class="card" aria-label="Invoices">
    <h2>Invoices</h2>
    <div id="invoice-list"><div class="empty">No invoices yet. Create your first invoice above.</div></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const money = (n) => "$" + n.toFixed(2);
  const store = JSON.parse(localStorage.getItem("invoicedesk") || "[]");
  let invoices = Array.isArray(store) ? store : [];
  let seq = invoices.length;

  function persist() { localStorage.setItem("invoicedesk", JSON.stringify(invoices)); }

  function addItemRow(desc = "", qty = 1, price = 0) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td><input class="f-desc" type="text" placeholder="What is this for?" value="' + desc.replace(/"/g, "&quot;") + '"></td>' +
      '<td class="num"><input class="f-qty" type="number" min="0" step="1" value="' + qty + '" style="max-width:80px"></td>' +
      '<td class="num"><input class="f-price" type="number" min="0" step="0.01" value="' + price + '" style="max-width:110px"></td>' +
      '<td class="num row-total">$0.00</td>' +
      '<td class="num"><button type="button" class="small f-remove">Remove</button></td>';
    tr.querySelector(".f-remove").addEventListener("click", () => { tr.remove(); recalc(); });
    tr.querySelectorAll("input").forEach((i) => i.addEventListener("input", recalc));
    $("items").appendChild(tr);
    recalc();
  }

  function readItems() {
    return [...$("items").querySelectorAll("tr")].map((tr) => ({
      desc: tr.querySelector(".f-desc").value.trim(),
      qty: parseFloat(tr.querySelector(".f-qty").value) || 0,
      price: parseFloat(tr.querySelector(".f-price").value) || 0,
    }));
  }

  // Money rules (SPEC.md): discount comes off the subtotal first;
  // tax is charged on the discounted amount only.
  function computeTotals(items, discountPct, taxPct) {
    const subtotal = items.reduce((s, it) => s + it.qty * it.price, 0);
    const discount = subtotal * (discountPct / 100);
    const taxable = subtotal - discount;
    const tax = taxable * (taxPct / 100);
    return { subtotal, discount, tax, total: taxable + tax };
  }

  function recalc() {
    const items = readItems();
    items.forEach((it, i) => {
      const cell = $("items").querySelectorAll("tr")[i].querySelector(".row-total");
      cell.textContent = money(it.qty * it.price);
    });
    const t = computeTotals(items, parseFloat($("discount").value) || 0, parseFloat($("tax").value) || 0);
    $("subtotal").textContent = money(t.subtotal);
    $("discount-amount").textContent = "−" + money(t.discount);
    $("tax-amount").textContent = money(t.tax);
    $("grand-total").textContent = money(t.total);
    return t;
  }

  function renderInvoices() {
    const list = $("invoice-list");
    if (!invoices.length) {
      list.innerHTML = '<div class="empty">No invoices yet. Create your first invoice above.</div>';
    } else {
      const rows = invoices.map((inv) =>
        "<tr><td>" + inv.number + "</td><td>" + inv.client.replace(/</g, "&lt;") + "</td>" +
        '<td class="num">' + money(inv.total) + "</td>" +
        '<td><span class="badge ' + (inv.paid ? "paid" : "unpaid") + '">' + (inv.paid ? "Paid" : "Unpaid") + "</span></td>" +
        "<td class=\"num\">" + (inv.paid ? "" : '<button type="button" class="small" data-pay="' + inv.number + '">Mark paid</button>') + "</td></tr>"
      ).join("");
      list.innerHTML = '<table aria-label="Saved invoices"><thead><tr><th>Number</th><th>Client</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>' + rows + "</tbody></table>";
      list.querySelectorAll("[data-pay]").forEach((b) => b.addEventListener("click", () => {
        const inv = invoices.find((i) => i.number === b.getAttribute("data-pay"));
        if (inv) { inv.paid = true; persist(); renderInvoices(); }
      }));
    }
    const billed = invoices.reduce((s, i) => s + i.total, 0);
    const collected = invoices.filter((i) => i.paid).reduce((s, i) => s + i.total, 0);
    $("stat-billed").textContent = money(billed);
    $("stat-collected").textContent = money(collected);
    $("stat-outstanding").textContent = money(billed - collected);
  }

  $("add-item").addEventListener("click", () => addItemRow());
  $("discount").addEventListener("input", recalc);
  $("tax").addEventListener("input", recalc);
  $("clear-form").addEventListener("click", () => {
    $("client").value = ""; $("discount").value = 0; $("tax").value = 0;
    $("items").innerHTML = ""; $("form-error").classList.remove("show");
    addItemRow(); recalc();
  });
  $("save-invoice").addEventListener("click", () => {
    const err = $("form-error");
    const client = $("client").value.trim();
    const items = readItems().filter((it) => it.desc && it.qty > 0 && it.price > 0);
    if (!client) { err.textContent = "Please enter a client name before saving."; err.classList.add("show"); return; }
    if (!items.length) { err.textContent = "Add at least one line item with a description, quantity and price."; err.classList.add("show"); return; }
    err.classList.remove("show");
    const t = recalc();
    seq += 1;
    invoices.unshift({ number: "INV-" + String(seq).padStart(3, "0"), client, total: t.total, paid: false });
    persist(); renderInvoices();
    $("clear-form").click();
  });

  addItemRow();
  renderInvoices();
  recalc();
</script>
</body>
</html>
